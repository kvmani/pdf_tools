<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="t d"><title id="t">PDF page transformation workflow</title><desc id="d">Local PDFs pass through validation, page parsing, ordered selection, assembly, and download.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#0f6b58"/></marker></defs><rect width="1000" height="410" rx="25" fill="#f8faf9"/><rect x="28" y="28" width="944" height="72" rx="16" fill="#0f6b58"/><text x="58" y="60" fill="#9fd8c6" font-family="Arial" font-size="13" font-weight="700">LOCAL DOCUMENT TRANSFORMATION</text><text x="58" y="85" fill="white" font-family="Arial" font-size="22" font-weight="700">Validate → parse → select → assemble → stream</text><g font-family="Arial"><g transform="translate(42 145)"><rect width="160" height="118" rx="14" fill="white" stroke="#e1e7e4"/><text x="16" y="30" fill="#0f6b58" font-size="12" font-weight="700">01 INPUT</text><text x="16" y="60" fill="#15211d" font-size="17" font-weight="700">PDF files</text><text x="16" y="89" fill="#66756f" font-size="12">type · size · lock</text></g><g transform="translate(230 145)"><rect width="160" height="118" rx="14" fill="#e7f3ef" stroke="#0f6b58"/><text x="16" y="30" fill="#0b5747" font-size="12" font-weight="700">02 PARSE</text><text x="16" y="60" fill="#15211d" font-size="17" font-weight="700">Page tree</text><text x="16" y="89" fill="#66756f" font-size="12">count · metadata</text></g><g transform="translate(418 145)"><rect width="160" height="118" rx="14" fill="white" stroke="#e1e7e4"/><text x="16" y="30" fill="#0f6b58" font-size="12" font-weight="700">03 SELECT</text><text x="16" y="60" fill="#15211d" font-size="17" font-weight="700">Ranges + order</text><text x="16" y="89" fill="#66756f" font-size="12">inclusive · 1-based</text></g><g transform="translate(606 145)"><rect width="160" height="118" rx="14" fill="#fff8e6" stroke="#e3b27a"/><text x="16" y="30" fill="#c2691f" font-size="12" font-weight="700">04 ASSEMBLE</text><text x="16" y="60" fill="#15211d" font-size="17" font-weight="700">Copy pages</text><text x="16" y="89" fill="#66756f" font-size="12">write new tree</text></g><g transform="translate(794 145)"><rect width="160" height="118" rx="14" fill="#0f6b58"/><text x="16" y="30" fill="#9fd8c6" font-size="12" font-weight="700">05 OUTPUT</text><text x="16" y="60" fill="white" font-size="17" font-weight="700">Download</text><text x="16" y="89" fill="#cde5dd" font-size="12">PDF / images</text></g></g><g stroke="#0f6b58" stroke-width="3" marker-end="url(#a)"><path d="M203 204H223"/><path d="M391 204H411"/><path d="M579 204H599"/><path d="M767 204H787"/></g><rect x="42" y="305" width="912" height="65" rx="14" fill="white" stroke="#e1e7e4"/><text x="70" y="345" fill="#15211d" font-family="Georgia" font-size="23" font-weight="700">P_out = concat(P_j[a_j:b_j])</text><text x="545" y="344" fill="#66756f" font-family="Arial" font-size="13">Preview and verify the page order before download.</text></svg>
