<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}PDF Tools{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('pdf_tools.static', filename='style.css') }}">
    <script src="{{ url_for('pdf_tools.static', filename='js/pdf.min.js') }}"></script>
    <script defer src="{{ url_for('pdf_tools.static', filename='js/browser_support.js') }}"></script>
    <script defer src="{{ url_for('pdf_tools.static', filename='js/preview.js') }}"></script>
    <script defer src="{{ url_for('pdf_tools.static', filename='js/extract.js') }}"></script>
</head>
<body>
<header><nav><a class="brand" href="{{ url_for('pdf_tools.index') }}">PDF Tools <span>OFFICE SCIENTIFIC TOOLS</span></a><div class="nav-links"><a href="{{ url_for('pdf_tools.merge.form') }}">Merge PDFs</a><a href="{{ url_for('pdf_tools.extract.form') }}">Extract Pages</a></div></nav></header>
<main class="page-shell">{% block content %}{% endblock %}</main>
</body>
</html>
